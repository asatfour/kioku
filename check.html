<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>インストール診断</title>
<!-- Chrome は「文書に link された」manifest しか見ない。fetch で読めても判定には使われない。 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#14161a">
<style>
  body { font-family: system-ui, sans-serif; background: #14161a; color: #e8eaed;
         margin: 0; padding: 16px; line-height: 1.7; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  li { list-style: none; }
  .ng { color: #ff8a80; }
  .ok { color: #9be29b; }
  .note { color: #9aa0a6; font-size: 13px; word-break: break-all; }
  button { font-size: 17px; padding: 14px 20px; width: 100%; margin: 16px 0;
           border: 0; border-radius: 10px; background: #4c8bf5; color: #fff; }
  button[disabled] { background: #3a3f47; color: #9aa0a6; }
</style>
<h1>インストール診断</h1>
<button id="install" disabled>インストール（まだ準備できていません）</button>
<ul id="out"><li>調べています…</li></ul>

<script>
// PWA としてインストールできる条件が満たされているかを端末側で判定する。
// beforeinstallprompt が飛ぶかどうかが Chrome の最終判断そのもの。
const out = document.getElementById("out");
const rows = [];
const say = (name, state, detail = "") => {
  rows.push({ name, state, detail });
  out.innerHTML = rows.map((r) =>
    `<li class="${r.state === true ? "ok" : r.state === false ? "ng" : ""}">` +
    `${r.state === true ? "OK" : r.state === false ? "NG" : "--"} ${r.name}` +
    (r.detail ? `<div class="note">${r.detail}</div>` : "") + "</li>").join("");
};

let deferred = null;
const btn = document.getElementById("install");
addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferred = e;
  btn.disabled = false;
  btn.textContent = "このアプリをインストール";
  say("インストール可能（Chromeが承認）", true, "上のボタンで入ります");
});
btn.addEventListener("click", async () => {
  if (!deferred) return;
  deferred.prompt();
  const { outcome } = await deferred.userChoice;
  say("インストールの結果", outcome === "accepted", outcome);
});

(async () => {
  const ua = navigator.userAgent;
  say("ブラウザ", null, ua);

  // UA文字列は誰でも書き換えられる。こちらはブラウザ本体が答えるので詐称しにくい。
  // beforeinstallprompt は Chrome系だけの機能なので、ここが本物かどうかが決定的。
  const uad = navigator.userAgentData;
  if (!uad) {
    say("本当にChromeか（ブラウザ本体の申告）", false,
        "userAgentData が無い → Chrome系ではありません。この種のブラウザはPWAをインストールできません");
  } else {
    let ex = {};
    try {
      ex = await uad.getHighEntropyValues(["fullVersionList", "platformVersion", "model"]);
    } catch (e) { /* 取れなくても brands だけで足りる */ }
    const brands = (uad.brands || []).map((b) => `${b.brand} ${b.version}`).join(" / ");
    const isWebView = /Android WebView/i.test(brands);
    const isChrome = /Google Chrome/i.test(brands) && !isWebView;
    say("本当にChromeか（ブラウザ本体の申告）", isChrome,
        `${brands}｜端末: ${ex.model || "不明"}｜Android ${ex.platformVersion || "?"}`
        + (isWebView ? "　★WebView製のブラウザです。PWAはインストールできません" : "")
        + (!isChrome && !isWebView ? "　★Chromeではありません" : ""));
  }

  // これが無いと他が全部揃っていてもインストールできない（最初にここで詰まった）
  const linked = document.querySelector('link[rel="manifest"]');
  say("manifest が文書に link されている", !!linked, linked ? linked.getAttribute("href") : "無い");
  // アプリ内ブラウザ（LINE/X/Instagram等）は仕様上インストールできない
  const inApp = /(FBAN|FBAV|Instagram|Line\/|Twitter|MicroMessenger)/i.test(ua);
  say("アプリ内ブラウザではない", !inApp,
      inApp ? "リンクをChromeで開き直してください（メニュー→ブラウザで開く）" : "");
  say("Chrome系である", /Chrome\//.test(ua) && !/EdgA|OPR|SamsungBrowser|Firefox/.test(ua),
      /EdgA|OPR|SamsungBrowser|Firefox/.test(ua) ? "Chrome以外は表示位置が違います" : "");
  say("安全な接続（https）", isSecureContext, location.origin);
  say("すでにインストール済みで開いている",
      matchMedia("(display-mode: standalone)").matches ? true : null,
      matchMedia("(display-mode: standalone)").matches ? "アプリとして起動中です" : "ブラウザで表示中");

  try {
    const reg = await navigator.serviceWorker.register("sw.js");
    say("Service Worker 登録", !!reg, "scope: " + reg.scope);
    await navigator.serviceWorker.ready;
    say("Service Worker 起動完了", true);
    // ここが肝。初回アクセスでは SW がこのページを「制御」していないことがあり、
    // その間 Chrome はインストール可能と判定しない。1回読み直すと制御下に入る。
    const controlled = !!navigator.serviceWorker.controller;
    say("このページが Service Worker の制御下にある", controlled,
        controlled ? "" : "★これが原因の可能性が高いです。下の『読み直す』を押してください");
    if (!controlled) {
      const b = document.createElement("button");
      b.textContent = "読み直す（1回で制御下に入ります）";
      b.onclick = () => location.reload();
      document.body.insertBefore(b, document.getElementById("out"));
    }
  } catch (e) {
    say("Service Worker 登録", false, String(e && (e.message || e)));
  }

  // シークレットモードでは Chrome はインストールを許可せず、通知も飛ばさない。
  // 直接は判別できないので、保存できる容量の少なさから推定する（通常は数十GB、シークレットは数GB）。
  try {
    const est = await navigator.storage?.estimate?.();
    if (est && est.quota) {
      const gb = est.quota / 1073741824;
      say("シークレットモードではなさそう（推定）", gb > 4,
          `保存できる容量 ${gb.toFixed(1)}GB` + (gb <= 4 ? "　★シークレットタブだとインストールできません" : ""));
    }
  } catch (e) { /* 取れない端末では飛ばす */ }

  // 端末によっては画面に一度触れるまで通知が来ないので、触れたら数え直す
  addEventListener("pointerdown", function once() {
    removeEventListener("pointerdown", once);
    if (!deferred) say("画面に触れました（ここから改めて通知を待ちます）", null, "");
  }, { once: true });

  try {
    if (navigator.getInstalledRelatedApps) {
      const apps = await navigator.getInstalledRelatedApps();
      say("すでに入っているアプリとして検出されない", apps.length === 0,
          apps.length ? JSON.stringify(apps) : "なし");
    }
  } catch (e) { /* 対応していない端末では飛ばす */ }

  try {
    const r = await fetch("manifest.webmanifest");
    const m = await r.json();
    say("manifest 取得", r.ok, r.headers.get("content-type") || "");
    say("display が standalone", m.display === "standalone", m.display);
    const su = new URL(m.start_url, location.href).href;
    say("start_url がスコープ内", su.startsWith(new URL(m.scope, location.href).href), su);
    for (const ic of m.icons) {
      const ir = await fetch(new URL(ic.src, location.href));
      const blob = await ir.blob();
      const bmp = await createImageBitmap(blob);
      say(`アイコン ${ic.sizes}`, ir.ok && `${bmp.width}x${bmp.height}` === ic.sizes,
          `${bmp.width}x${bmp.height} / ${blob.type} / ${blob.size}B / purpose=${ic.purpose}`);
    }
  } catch (e) {
    say("manifest 検査", false, String(e && (e.message || e)));
  }

  // beforeinstallprompt は遅れて飛ぶことがあるので、30秒待って様子を出し続ける
  const started = Date.now();
  const waitRow = document.createElement("li");
  waitRow.className = "note";
  out.appendChild(waitRow);
  const timer = setInterval(() => {
    const sec = Math.round((Date.now() - started) / 1000);
    if (deferred || matchMedia("(display-mode: standalone)").matches) {
      clearInterval(timer);
      waitRow.textContent = "";
      return;
    }
    waitRow.textContent = `Chromeからのインストール可能通知を待っています… ${sec}秒`;
    if (sec >= 30) {
      clearInterval(timer);
      waitRow.textContent = "";
      say("インストール可能の通知", false,
          "30秒待っても来ませんでした。上に NG があればそれが原因です。"
          + "全部 OK なら、Chromeのメニュー（右上の ⋮ ）から「アプリをインストール」"
          + "または「ホーム画面に追加」を選んでください。それも無い場合は、"
          + "一度このページを読み直してからもう一度お試しください。");
    }
  }, 1000);
})();
</script>
</html>
